<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中元普渡法會</title>
<style>
  /* ================= 配色設定：想換顏色改這裡 ================= */
  :root{
    --red:#a3231f;         /* 主色（深紅） */
    --red-dark:#7d1a17;
    --gold:#c99a3f;        /* 金 */
    --cream:#fdf8f0;       /* 背景米色 */
    --paper:#ffffff;
    --ink:#2b2320;         /* 主要文字 */
    --ink-dim:#7a6f68;     /* 次要文字 */
    --line:#e7dccb;
    --radius:14px;
    --maxw:1100px;
    --stripw:800px;        /* 圖片長條在電腦上的最大寬度，想更寬就把數字調大 */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--cream);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
    line-height:1.75;-webkit-font-smoothing:antialiased;
    padding-bottom:82px; /* 留給底部購物車列 */
  }
  img{display:block;max-width:100%;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px;}
  h2.sec{
    text-align:center;font-size:clamp(1.4rem,4vw,2rem);margin:0 0 6px;letter-spacing:.02em;
  }
  h2.sec + .sub{text-align:center;color:var(--ink-dim);margin:0 0 28px;font-size:.95rem;}
  .sec-wrap{padding:52px 0;}

  /* ================= 頂部跑馬燈促銷條 ================= */
  .promo{
    background:var(--red);color:#fff;text-align:center;
    font-weight:700;letter-spacing:.05em;padding:9px 14px;font-size:.95rem;
    position:sticky;top:0;z-index:30;
  }

  /* ================= 圖片長條：一張接一張直落、中間無縫 ================= */
  .strip{
    max-width:var(--stripw);   /* 電腦上不會拉到太寬；手機自動滿版 */
    margin:0 auto;
    /* 底色要跟圖片邊緣接近（你的圖幾乎都是黑底），
       萬一有一點點縫也看不出來。圖片換成亮色系時記得改這裡 */
    background:#000;
    font-size:0;line-height:0; /* 消掉圖片之間的空隙 */
  }
  .shot{display:block;position:relative;}
  /* 疊在圖片上的透明按鈕（例如圖片裡的 LINE 連結） */
  .hotspot{
    position:absolute;z-index:2;display:block;
    border-radius:999px;
    background:transparent;
    -webkit-tap-highlight-color:transparent;
  }
  .hotspot:hover{background:rgba(255,255,255,.10);}  /* 滑鼠移上去才有淡淡反應 */
  .hotspot:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  /* 圖片放大後高度常帶小數點，交界處會露出 1px 白線；
     讓每張往上疊 1px 就不會有縫（少 1px 完全看不出來） */
  .shot + .shot{margin-top:-1px;}
  .shot .frame{
    display:block;font-size:0;line-height:0;
    /* 載入前的暫定高度，實際比例由程式依每張圖片個別設定 */
    /* 圖片載入中的閃爍佔位，用深色才不會在黑底動畫之間閃一塊亮的 */
    background:linear-gradient(100deg,#0d0d0d 30%,#242424 50%,#0d0d0d 70%);
    background-size:200% 100%;animation:shim 1.6s linear infinite;
  }
  .shot.loaded .frame{aspect-ratio:auto;animation:none;background:none;}
  .shot img,.shot video{
    width:100%;height:auto;display:block;
    opacity:0;transition:opacity .4s;
  }
  .shot.loaded img,.shot.loaded video{opacity:1;}
  @keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

  /* ================= 方案卡 ================= */
  .plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
  .plan{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 22px;text-align:center;position:relative;
    display:flex;flex-direction:column;
  }
  .plan.hot{border-color:var(--gold);box-shadow:0 6px 24px rgba(201,154,63,.16);}
  .plan .badge{
    position:absolute;top:-12px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#fff;font-size:.78rem;font-weight:700;
    padding:3px 14px;border-radius:999px;white-space:nowrap;
  }
  .plan h3{margin:6px 0 4px;font-size:1.3rem;}
  .plan .desc{color:var(--ink-dim);font-size:.9rem;margin:0 0 18px;min-height:3em;}
  .plan .price{font-size:2.3rem;font-weight:900;color:var(--red);line-height:1;}
  .plan .price small{font-size:1rem;font-weight:700;}
  .plan .was{color:var(--ink-dim);text-decoration:line-through;font-size:.9rem;margin-top:6px;}
  .plan ul{
    list-style:none;padding:0;margin:18px 0 22px;text-align:left;font-size:.92rem;flex:1;
  }
  .plan li{padding-left:22px;position:relative;margin-bottom:6px;}
  .plan li::before{content:"✓";position:absolute;left:0;color:var(--gold);font-weight:700;}

  .btn{
    display:block;width:100%;border:0;border-radius:999px;cursor:pointer;
    background:var(--red);color:#fff;font-size:1.05rem;font-weight:700;
    padding:13px 20px;font-family:inherit;transition:background .2s,transform .1s;
  }
  .btn:hover{background:var(--red-dark);}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:#fff;color:var(--red);border:1.5px solid var(--red);}
  .btn.ghost:hover{background:#fbf1f0;}

  /* ================= 加購 ================= */
  .addons{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  .addon{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;
  }
  .addon .nm{font-weight:700;font-size:.98rem;}
  .addon .pr{color:var(--red);font-weight:800;}
  .addon .btn{padding:9px;font-size:.9rem;margin-top:auto;}

  /* ================= 說明區 ================= */
  .notes{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 24px;
  }
  .notes ol{margin:0;padding-left:1.3em;}
  .notes li{margin-bottom:8px;}

  /* ================= 訂購表單 ================= */
  #order{background:#fffdf8;border-top:1px solid var(--line);}
  .cart-box{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:24px;
  }
  .cart-row{
    display:flex;align-items:center;gap:12px;
    padding:11px 0;border-bottom:1px dashed var(--line);font-size:.95rem;
  }
  .cart-row:last-of-type{border-bottom:0;}
  .cart-row .nm{flex:1;min-width:0;}
  .qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .qty button{
    width:30px;height:30px;border:0;background:#f7f1e6;color:var(--ink);
    font-size:1rem;cursor:pointer;font-family:inherit;
  }
  .qty button:hover{background:#efe6d6;}
  .qty span{min-width:34px;text-align:center;font-weight:700;font-size:.95rem;}
  .cart-row .amt{width:82px;text-align:right;font-weight:700;}
  .cart-empty{color:var(--ink-dim);text-align:center;padding:14px 0;}
  .cart-total{
    display:flex;justify-content:space-between;align-items:baseline;
    border-top:2px solid var(--ink);margin-top:12px;padding-top:12px;font-weight:800;
  }
  .cart-total .big{font-size:1.6rem;color:var(--red);}

  .field{margin-bottom:16px;}
  .field label{display:block;font-weight:700;font-size:.93rem;margin-bottom:6px;}
  .field label .req{color:var(--red);}
  .field .hint{font-weight:400;color:var(--ink-dim);font-size:.85rem;}
  .field input[type=text],.field input[type=tel],.field input[type=email],
  .field textarea,.field select{
    width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;
    font-family:inherit;font-size:1rem;background:#fff;color:var(--ink);
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);
  }
  .field textarea{min-height:88px;resize:vertical;}
  .radios{display:flex;flex-wrap:wrap;gap:10px;}
  .radios label{
    flex:1;min-width:130px;border:1px solid var(--line);border-radius:9px;
    padding:11px;background:#fff;cursor:pointer;font-weight:400;text-align:center;margin:0;
  }
  .radios input{margin-right:6px;accent-color:var(--red);}
  .radios label:has(input:checked){border-color:var(--red);background:#fbf1f0;font-weight:700;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:560px){.two-col{grid-template-columns:1fr;gap:0;}}

  /* ================= 底部固定購物車列 ================= */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.97);border-top:1px solid var(--line);
    box-shadow:0 -4px 20px rgba(0,0,0,.07);
    padding:12px 18px;display:flex;align-items:center;gap:14px;
  }
  .bar .info{flex:1;min-width:0;line-height:1.35;}
  .bar .info .lbl{font-size:.8rem;color:var(--ink-dim);}
  .bar .info .sum{font-size:1.35rem;font-weight:900;color:var(--red);}
  .bar .btn{width:auto;padding:13px 30px;white-space:nowrap;}

  /* ================= 送出後畫面 ================= */
  .done{
    position:fixed;inset:0;z-index:60;display:none;
    align-items:center;justify-content:center;background:rgba(43,35,32,.6);padding:22px;
  }
  .done.open{display:flex;}
  .done .card{
    background:#fff;border-radius:18px;padding:38px 30px;text-align:center;max-width:420px;width:100%;
  }
  .done .mark{font-size:3rem;color:var(--gold);line-height:1;}
  .done h3{margin:14px 0 10px;font-size:1.4rem;}
  .done p{color:var(--ink-dim);margin:0 0 20px;font-size:.95rem;}
  .done .btn{margin-bottom:10px;text-decoration:none;text-align:center;}
  .done .btn:last-child{margin-bottom:0;}
  .btn.line{background:#06C755;}          /* LINE 官方品牌綠 */
  .btn.line:hover{background:#05a648;}
  .done .tip{font-size:.82rem;margin:0 0 14px;}

  footer{
    background:var(--red-dark);color:#f5e6d6;text-align:center;
    padding:34px 18px;font-size:.9rem;
  }
  footer a{color:#fff;}
</style>
</head>
<body>

<!-- ========== 頂部促銷條 ========== -->
<div class="promo" id="promoBar"></div>

<!-- ========== 圖片長條（滿版直落） ========== -->
<div class="strip" id="imgStrip"></div>

<!-- ========== 方案 ========== -->
<section class="sec-wrap">
  <div class="wrap">
    <h2 class="sec">報名方案</h2>
    <p class="sub">請選擇欲報名之項目，可複選、可調整數量</p>
    <div class="plans" id="plans"></div>
  </div>
</section>

<!-- ========== 加購 ========== -->
<section class="sec-wrap" style="background:#fffdf8;border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
  <div class="wrap">
    <h2 class="sec">加購項目</h2>
    <p class="sub">隨法會一同祈福，數量有限</p>
    <div class="addons" id="addons"></div>
  </div>
</section>

<!-- ========== 注意事項 ========== -->
<section class="sec-wrap">
  <div class="wrap">
    <h2 class="sec">報名須知</h2>
    <p class="sub">報名前請詳閱以下說明</p>
    <div class="notes"><ol id="notesList"></ol></div>
  </div>
</section>

<!-- ========== 訂購表單 ========== -->
<section class="sec-wrap" id="order">
  <div class="wrap" style="max-width:720px;">
    <h2 class="sec">填寫報名資料</h2>
    <p class="sub">資料將用於製作疏文與牌位，請確實填寫</p>

    <div class="cart-box">
      <div id="cartList"></div>
      <div class="cart-total">
        <span>合計</span>
        <span class="big">NT$ <span id="cartTotal">0</span></span>
      </div>
    </div>

    <form id="orderForm" novalidate>
      <div class="two-col">
        <div class="field">
          <label>報名人姓名 <span class="req">*</span></label>
          <input type="text" name="name" required autocomplete="name">
        </div>
        <div class="field">
          <label>聯絡手機 <span class="req">*</span></label>
          <input type="tel" name="phone" required autocomplete="tel" placeholder="09xxxxxxxx">
        </div>
      </div>

      <div class="field">
        <label>Email <span class="req">*</span> <span class="hint">（報名確認信會寄到這裡）</span></label>
        <input type="email" name="email" required autocomplete="email">
      </div>

      <!-- 蜜罐欄位：真人看不到也不會填，只有機器人會 -->
      <div style="position:absolute;left:-9999px;" aria-hidden="true">
        <label>請勿填寫<input type="text" name="website" tabindex="-1" autocomplete="off"></label>
      </div>

      <div class="field">
        <label>聯絡地址 <span class="hint">（寄送平安符與結緣品）</span></label>
        <input type="text" name="address" autocomplete="street-address">
      </div>

      <div class="field">
        <label>祈福／牌位資料 <span class="req">*</span></label>
        <div class="hint" style="margin-bottom:6px;">請填寫姓名，多位請逐行分開填寫</div>
        <textarea name="blessing" required placeholder="例：&#10;王小明&#10;王大華 闔家"></textarea>
      </div>

      <div class="field">
        <label>付款方式 <span class="req">*</span></label>
        <div class="radios" id="payRadios"></div>
      </div>

      <div class="field">
        <label>備註</label>
        <textarea name="note" placeholder="其他需要說明的事項"></textarea>
      </div>

      <button type="submit" class="btn" style="margin-top:8px;padding:16px;font-size:1.15rem;">
        送出報名
      </button>
      <p style="text-align:center;color:var(--ink-dim);font-size:.85rem;margin-top:12px;">
        送出後我們將以電話或 Email 與您確認
      </p>
    </form>
  </div>
</section>

<footer>
  <div id="footText"></div>
</footer>

<!-- ========== 底部購物車列 ========== -->
<div class="bar">
  <div class="info">
    <div class="lbl">目前小計（<span id="barCount">0</span> 項）</div>
    <div class="sum">NT$ <span id="barTotal">0</span></div>
  </div>
  <button class="btn" id="goOrder">前往報名</button>
</div>

<!-- ========== 送出成功畫面 ========== -->
<div class="done" id="doneBox">
  <div class="card">
    <div class="mark">✽</div>
    <h3>最後一步</h3>
    <p id="doneMsg"></p>
    <a class="btn line" id="lineSend" href="#" target="_blank" rel="noopener">用 LINE 傳送訂單</a>
    <p class="tip">按下後會開啟官方帳號聊天室，訂單內容已幫你填好，直接按傳送即可</p>
    <button class="btn ghost" id="copyOrder">複製訂單內容</button>
    <button class="btn ghost" id="doneClose">關閉</button>
  </div>
</div>

<script>
/* ============================================================================
   ★★★★★  所有內容都在這個設定區，改這裡就好  ★★★★★
   ============================================================================ */

const SITE = {
  promo:    "中元普渡法會開放報名中 ‧ 名額有限額滿為止",
  title:    "中元普渡法會",   // 瀏覽器分頁上顯示的名稱
  footer:   "報名專線：0000-000-000　│　服務時間 09:00 - 18:00",
  doneMsg:  "請把訂單傳給我們，才算完成報名。",
  lineId:   "@256gqoek",     // 官方帳號 ID（要含 @）。全站只有這裡要改
};

/* 官方帳號的「加好友／開啟聊天室」網址，由上面的 lineId 自動產生 */
const LINE_ADD_URL = 'https://line.me/R/ti/p/' + encodeURIComponent(SITE.lineId);

/* 圖片長條 —— 要加就在這裡加一行（檔案跟本檔案放同一個資料夾）
   支援圖片（.webp .png .jpg）和影片（.mp4 .webm）
   影片會自動播放、靜音、無限循環，看起來就跟動圖一樣

   寫法一：只寫檔名，會用下面 DEFAULT_RATIO 的比例當載入前的佔位高度
   寫法二：檔案比例跟別人不一樣時，寫成 { src:"檔名", w:寬, h:高 }
          這樣載入時版面才不會上下跳動

   要在圖片上疊透明按鈕（例如圖裡印了 LINE 帳號），加 links：
     { src:"3.webp", links:[ { href:"網址", x:9.7, y:75.7, w:80.3, h:19.4 } ] }
   x/y 是按鈕左上角的位置，w/h 是寬高，四個都用「佔整張圖的百分比」    */
const DEFAULT_RATIO = "640/1138";   // 大部分圖片的比例

const STRIP_IMAGES = [
  "1.webp",
  "2.webp",
  {
    src: "3.webp",
    links: [
      // 圖片下方紅圈起來的「官方LINE:@256GQOEK」
      { href:LINE_ADD_URL, label:"加入官方 LINE",
        x:9.7, y:75.7, w:80.3, h:19.4 },
    ],
  },
  "4.webp",
  { src:"5.webp", w:1024, h:1536 },   // 這張比例跟其他張不同
];

/* 報名方案 —— 要加方案就複製一整組 { ... } 貼在下面 */
const PLANS = [
  {
    id:    "p1",
    name:  "中元普渡普桌一份",
    desc:  "超薦歷代祖先、冤親債主，祈求闔家平安。",
    price: 1200,          // 實際售價
    was:   0,             // 原價（會顯示劃掉的價格）；不想顯示就填 0
    hot:   true,          // true 會加上金框與角標
    badge: "熱門報名",
    items: [              // 方案包含什麼（可自由增減）
      "法會牌位一位",
      "疏文填寫與焚化",
      "全程如儀誦經迴向",
    ],
  },
  // ↓↓↓ 要再開其他方案，把下面這組的 // 拿掉並改內容 ↓↓↓
  // {
  //   id:"p2", name:"闔家祈福方案", desc:"全家一同祈福。",
  //   price:0, was:0, hot:false, badge:"",
  //   items:["項目一","項目二"],
  // },
];

/* 加購項目 —— 不需要就把整個 [ ] 裡面清空，區塊會自動隱藏 */
const ADDONS = [
  { id:"a1", name:"全家消災",   price:1000 },
  { id:"a2", name:"個人消災",   price:500 },
  { id:"a3", name:"冤親債主",   price:500 },
  { id:"a4", name:"無緣子女",   price:500 },
  { id:"a5", name:"歷代祖先",   price:500 },
  { id:"a6", name:"親朋好友",   price:500 },
  { id:"a7", name:"地基主",     price:500 },
];

/* 付款方式選項 */
const PAYMENTS = ["銀行匯款", "現場繳費"];

/* 報名須知 */
const NOTES = [
  "報名截止日：法會前三日截止，額滿提前結束。",
  "牌位資料送出後如需更改，請於截止日前來電告知。",
  "報名確認後將以電話或 Email 通知，並提供匯款資訊。",
  "法會當日不克前來者，本堂將代為祈福迴向，功德相同。",
];

/* ============================================================================
   ↓↓↓ 以下是程式邏輯，不用改 ↓↓↓
   ============================================================================ */

const $ = id => document.getElementById(id);
const nt = n => n.toLocaleString('zh-TW');

/* ---------- 套用文字設定 ---------- */
$('promoBar').textContent = SITE.promo;
$('footText').textContent = SITE.footer;
$('doneMsg').textContent  = SITE.doneMsg;
document.title = SITE.title;

/* ---------- 圖片長條（捲到才載入，GIF 檔很大時很重要） ---------- */
const stripWrap = $('imgStrip');
const isVideo = src => /\.(mp4|webm|mov|m4v)$/i.test(src);

STRIP_IMAGES.forEach(item => {
  // 兩種寫法都接受："檔名" 或 { src:"檔名", w:寬, h:高 }
  const src = typeof item === 'string' ? item : item.src;

  const box = document.createElement('div');
  box.className = 'shot';
  const frame = document.createElement('div');
  frame.className = 'frame';
  // 有給尺寸就用它的比例當佔位高度，沒給就用預設比例
  frame.style.aspectRatio = (item.w && item.h) ? `${item.w}/${item.h}` : DEFAULT_RATIO;

  // 載入完成後要把佔位比例清掉，改由檔案的真實高度決定
  const done = () => { box.classList.add('loaded'); frame.style.aspectRatio = ''; };

  let el;
  if (isVideo(src)) {
    // 影片：自動播放、靜音、循環（跟動圖看起來一樣，但檔案小很多）
    el = document.createElement('video');
    el.autoplay = true;
    el.muted = true;          // 沒有靜音瀏覽器會擋掉自動播放
    el.loop = true;
    el.playsInline = true;    // iPhone 才不會跳全螢幕播放器
    el.setAttribute('muted', '');
    el.setAttribute('playsinline', '');
    el.preload = 'none';
    el.addEventListener('loadeddata', done);
  } else {
    el = document.createElement('img');
    el.alt = SITE.title;
    el.addEventListener('load', done);
  }
  el.dataset.src = src;

  frame.appendChild(el);
  box.appendChild(frame);

  // 疊上透明按鈕（如果這張圖有設定 links）
  (item.links || []).forEach(lk => {
    const a = document.createElement('a');
    a.className = 'hotspot';
    a.href = lk.href;
    a.target = '_blank';
    a.rel = 'noopener';
    a.setAttribute('aria-label', lk.label || '連結');
    a.style.left   = lk.x + '%';
    a.style.top    = lk.y + '%';
    a.style.width  = lk.w + '%';
    a.style.height = lk.h + '%';
    box.appendChild(a);
  });

  stripWrap.appendChild(box);
});

const io = new IntersectionObserver((entries, obs) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    const el = e.target.querySelector('img, video');
    if (el && !el.src) {
      el.src = el.dataset.src;
      if (el.tagName === 'VIDEO') {
        el.preload = 'auto';
        el.play().catch(() => {});   // 瀏覽器擋自動播放時不要噴錯
      }
    }
    obs.unobserve(e.target);
  });
}, { rootMargin:'300px' });
document.querySelectorAll('.shot').forEach(s => io.observe(s));

/* ---------- 購物車狀態 ---------- */
const cart = {};   // { 品項id: 數量 }
const catalog = {};
PLANS.forEach(p  => catalog[p.id] = { ...p, kind:'plan'  });
ADDONS.forEach(a => catalog[a.id] = { ...a, kind:'addon' });

const isPlan   = id => catalog[id].kind === 'plan';
const hasPlan  = () => Object.keys(cart).some(isPlan);

function add(id, n = 1){
  // 規則：要先報名普桌方案，才能加購牌位
  if (!isPlan(id) && n > 0 && !hasPlan()) {
    alert('請先報名「' + PLANS[0].name + '」，才能加購牌位');
    document.getElementById('plans').scrollIntoView({ behavior:'smooth', block:'center' });
    return false;
  }

  cart[id] = Math.max(0, (cart[id] || 0) + n);
  if (cart[id] === 0) delete cart[id];

  // 方案被移除時，附帶的加購項目也一起清掉，避免留下孤兒訂單
  if (isPlan(id) && !hasPlan()) {
    Object.keys(cart).forEach(k => delete cart[k]);
  }
  render();
  return true;
}

/* ---------- 方案卡 ---------- */
$('plans').innerHTML = PLANS.map(p => `
  <div class="plan${p.hot ? ' hot' : ''}">
    ${p.hot && p.badge ? `<div class="badge">${p.badge}</div>` : ''}
    <h3>${p.name}</h3>
    <p class="desc">${p.desc || ''}</p>
    <div class="price"><small>NT$</small> ${nt(p.price)}</div>
    ${p.was ? `<div class="was">原價 NT$ ${nt(p.was)}</div>` : ''}
    <ul>${(p.items || []).map(i => `<li>${i}</li>`).join('')}</ul>
    <button class="btn" data-add="${p.id}">立即報名</button>
  </div>
`).join('');

/* ---------- 加購 ---------- */
if (ADDONS.length === 0) {
  $('addons').closest('section').style.display = 'none';
} else {
  $('addons').innerHTML = ADDONS.map(a => `
    <div class="addon">
      <div class="nm">${a.name}</div>
      <div class="pr">NT$ ${nt(a.price)}</div>
      <button class="btn ghost" data-add="${a.id}">加購</button>
    </div>
  `).join('');
}

/* 加購區的提示：還沒報名方案時顯示，報名後自動消失 */
const addonLock = document.createElement('p');
addonLock.id = 'addonLock';
addonLock.style.cssText =
  'text-align:center;color:var(--red);font-size:.9rem;margin:-14px 0 22px;font-weight:700;';
addonLock.textContent = '※ 請先報名上方方案，才能加購牌位';
$('addons').parentNode.insertBefore(addonLock, $('addons'));

/* ---------- 須知、付款方式 ---------- */
$('notesList').innerHTML = NOTES.map(n => `<li>${n}</li>`).join('');
$('payRadios').innerHTML = PAYMENTS.map((p, i) => `
  <label><input type="radio" name="pay" value="${p}"${i === 0 ? ' checked' : ''}>${p}</label>
`).join('');

/* ---------- 全站「加入」按鈕 ---------- */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-add]');
  if (btn && add(btn.dataset.add, 1)) flash(btn);   // 被規則擋下就不要顯示「已加入」

  const q = e.target.closest('[data-qty]');
  if (q) add(q.dataset.qty, Number(q.dataset.step));
});

function flash(btn){
  const old = btn.textContent;
  btn.textContent = '已加入 ✓';
  setTimeout(() => btn.textContent = old, 900);
}

/* ---------- 重新繪製購物車 ---------- */
function render(){
  const ids = Object.keys(cart);
  let total = 0, count = 0;

  $('cartList').innerHTML = ids.length === 0
    ? '<div class="cart-empty">尚未選擇項目</div>'
    : ids.map(id => {
        const it = catalog[id], n = cart[id], sum = it.price * n;
        total += sum; count += n;
        return `
          <div class="cart-row">
            <span class="nm">${it.name}</span>
            <span class="qty">
              <button data-qty="${id}" data-step="-1" aria-label="減少">−</button>
              <span>${n}</span>
              <button data-qty="${id}" data-step="1" aria-label="增加">＋</button>
            </span>
            <span class="amt">NT$ ${nt(sum)}</span>
          </div>`;
      }).join('');

  $('cartTotal').textContent = nt(total);
  $('barTotal').textContent  = nt(total);
  $('barCount').textContent  = count;

  // 還沒報名方案時，把加購區變灰並顯示提示
  const unlocked = hasPlan();
  const lock = $('addonLock');
  if (lock) lock.style.display = unlocked ? 'none' : 'block';
  document.querySelectorAll('.addon').forEach(el => {
    el.style.opacity = unlocked ? '1' : '.45';
  });
}
render();

/* ---------- 前往報名 ---------- */
$('goOrder').addEventListener('click', () => {
  $('order').scrollIntoView({ behavior:'smooth' });
});

/* ---------- 把訂單整理成要傳到 LINE 的文字 ---------- */
function buildOrderText(f){
  const d  = Object.fromEntries(new FormData(f));
  const ids = Object.keys(cart);
  const total = ids.reduce((s, id) => s + catalog[id].price * cart[id], 0);

  const L = [];
  L.push(`【${SITE.title}報名】`, '');
  L.push('▍報名項目');
  ids.forEach(id => {
    const it = catalog[id];
    L.push(`${it.name} x${cart[id]}　NT$${nt(it.price * cart[id])}`);
  });
  L.push(`合計　NT$${nt(total)}`, '');

  L.push('▍報名資料');
  L.push(`姓名：${d.name || ''}`);
  L.push(`電話：${d.phone || ''}`);
  if (d.email)   L.push(`Email：${d.email}`);
  if (d.address) L.push(`地址：${d.address}`);
  L.push(`付款方式：${d.pay || ''}`);

  if (d.blessing) L.push('', '▍祈福／牌位', d.blessing.trim());
  if (d.note)     L.push('', '▍備註', d.note.trim());

  return L.join('\n');
}

/* ---------- 送出：寄確認信給客人，同時把訂單帶到 LINE ---------- */
let orderText = '';

$('orderForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const submitBtn = f.querySelector('button[type=submit]');

  if (Object.keys(cart).length === 0) {
    alert('請先選擇報名方案');
    window.scrollTo({ top:0, behavior:'smooth' });
    return;
  }
  for (const el of f.querySelectorAll('[required]')) {
    if (!el.value.trim()) {
      alert('請填寫必填欄位');
      el.focus();
      return;
    }
  }

  orderText = buildOrderText(f);

  // LINE 官方格式：https://line.me/R/oaMessage/{帳號ID}/?{訊息}　兩段都要編碼
  $('lineSend').href =
    'https://line.me/R/oaMessage/' + encodeURIComponent(SITE.lineId) +
    '/?' + encodeURIComponent(orderText);

  // 送到後端寄確認信
  const d = Object.fromEntries(new FormData(f));
  const payload = {
    name:d.name, phone:d.phone, email:d.email, address:d.address,
    pay:d.pay, blessing:d.blessing, note:d.note, website:d.website,
    items: Object.keys(cart).map(id => ({
      name: catalog[id].name, price: catalog[id].price,
      qty: cart[id], kind: catalog[id].kind,
    })),
  };

  submitBtn.disabled = true;
  const oldLabel = submitBtn.textContent;
  submitBtn.textContent = '傳送中…';

  let mailed = false, failMsg = '';
  try {
    const r = await fetch('/api/order', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(payload),
    });
    const j = await r.json().catch(() => ({}));
    mailed = r.ok && j.ok;
    if (!mailed) failMsg = j.error || '信件寄送失敗';
  } catch {
    failMsg = '連線失敗';
  }

  submitBtn.disabled = false;
  submitBtn.textContent = oldLabel;

  // 依寄信結果調整完成畫面的文字
  $('doneMsg').textContent = mailed
    ? `報名確認信已寄到 ${d.email}，請再用 LINE 傳送訂單以便我們盡快處理。`
    : `${failMsg}。請改用下方 LINE 傳送訂單，我們一樣會收到。`;

  $('doneBox').classList.add('open');
});

/* ---------- 備援：複製訂單內容（LINE 開不起來時可以手動貼） ---------- */
$('copyOrder').addEventListener('click', async e => {
  const btn = e.currentTarget;
  try {
    await navigator.clipboard.writeText(orderText);
  } catch {
    // 舊瀏覽器或非 https 環境的備援做法
    const ta = document.createElement('textarea');
    ta.value = orderText;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  const old = btn.textContent;
  btn.textContent = '已複製 ✓';
  setTimeout(() => btn.textContent = old, 1500);
});

$('doneClose').addEventListener('click', () => $('doneBox').classList.remove('open'));
</script>
