server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 網頁本身不快取，你改完重新部署客人立刻看得到新版
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 圖片長期快取：客人第二次進來不用重新下載那 27MB
    location ~* \.(webp|gif|png|jpe?g|svg|ico|mp4|webm)$ {
        expires 30d;
        access_log off;
    }

    # 文字類檔案壓縮（圖片已經是壓縮格式，不需要再壓）
    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
